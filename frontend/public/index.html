<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- SEO -->
    <title>Bodyzeal Fitworks | Structured Fitness Training</title>
    <meta
      name="description"
      content="Bodyzeal Fitworks offers structured training, consistent coaching, and disciplined gym environments designed for long-term fitness progress."
    />
    <meta
      name="keywords"
      content="Bodyzeal Fitworks, gym, fitness, weight training, personal training, cardio, Coimbatore gym"
    />
    <meta name="author" content="Bodyzeal Fitworks" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="Bodyzeal Fitworks" />
    <meta
      property="og:description"
      content="Training built on structure, not shortcuts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo.jpg" />

    <!-- Favicon / Logo -->
    <link rel="icon" href="%PUBLIC_URL%/logo.jpg" />

    <!-- Google Font (Professional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- React Root -->
    <div id="root"></div>

  </body>
</html>
